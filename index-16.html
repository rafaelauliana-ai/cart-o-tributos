<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C5C46">
<title>Banco da Cidade dos Tributos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Instrument+Sans:wght@400..700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8EEEA; --surface:#FFFFFF; --surface2:#F3F6F4; --ink:#10231C; --muted:#56675F; --line:#D5DED8;
  --brand:#0C5C46; --brand-ink:#FFFFFF; --brand-soft:#D7E8E0;
  --debit:#B5302A; --debit-soft:#F6E1DE; --credit:#1F7A4D; --credit-soft:#DCEFE4; --add:#24508F; --add-soft:#DFE7F4; --swap:#8A6418; --swap-soft:#F2E8D3;
  --display:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;
  --text:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --shadow:0 1px 0 rgba(16,35,28,.04),0 10px 30px -12px rgba(16,35,28,.18);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1512; --surface:#13201B; --surface2:#182821; --ink:#E6EEE9; --muted:#97A8A0; --line:#24362E;
    --brand:#3FA37E; --brand-ink:#06120D; --brand-soft:#173329;
    --debit:#EC7466; --debit-soft:#3A1E1B; --credit:#5CC892; --credit-soft:#16301F; --add:#7FA6E6; --add-soft:#1A2639; --swap:#E0B45C; --swap-soft:#33291A;
    --shadow:0 10px 30px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0C1512; --surface:#13201B; --surface2:#182821; --ink:#E6EEE9; --muted:#97A8A0; --line:#24362E;
  --brand:#3FA37E; --brand-ink:#06120D; --brand-soft:#173329;
  --debit:#EC7466; --debit-soft:#3A1E1B; --credit:#5CC892; --credit-soft:#16301F; --add:#7FA6E6; --add-soft:#1A2639; --swap:#E0B45C; --swap-soft:#33291A;
  --shadow:0 10px 30px -12px rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--text);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--add);outline-offset:2px}
[hidden]{display:none!important}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:24px 18px;display:flex;flex-direction:column;gap:22px;border-right:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:42px;height:42px;border-radius:12px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.05rem;letter-spacing:-.02em}
.brand b{display:block;font-family:var(--display);font-weight:700;font-size:1.02rem;line-height:1.15}
.brand span{font-size:.82rem;color:var(--muted)}
.brand .mark{color:var(--brand-ink);font-size:1.05rem}
.snav{display:grid;gap:2px}
.snav button{display:flex;align-items:center;gap:12px;border:0;background:transparent;padding:.7rem .8rem;border-radius:var(--r-sm);font-weight:600;color:var(--muted);text-align:left}
.snav button:hover{background:var(--surface2);color:var(--ink)}
.snav button.on{background:var(--brand-soft);color:var(--ink)}
.side-foot{margin-top:auto;display:grid;gap:6px}
.lbl{font-size:.82rem;color:var(--muted);font-weight:600}
.sel{border:1px solid var(--line);border-radius:var(--r-sm);padding:.6rem .75rem;background:var(--surface2);font-weight:600;width:100%}
.main{min-width:0;padding:28px clamp(16px,4vw,48px) 48px}
.credit{margin:6px 0 0;font-size:.8rem;color:var(--muted)}
.credit b{color:var(--ink);font-weight:650}
.foot{display:none;max-width:1080px;margin:36px auto 0;padding-top:16px;border-top:1px solid var(--line);text-align:center}
@media (max-width:900px){.foot{display:block}}
.topbar{display:none}
.tabbar{display:none}
.view{max-width:1080px;margin:0 auto}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .main{padding:0 16px calc(96px + env(safe-area-inset-bottom,0px))}
  .topbar{display:flex;position:sticky;top:0;z-index:5;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;background:var(--bg);margin-bottom:8px}
  .topbar .sel{width:auto;max-width:46%;padding:.45rem .6rem;font-size:.9rem}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);align-items:end;position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px))}
  .tabbar button{border:0;background:transparent;display:grid;justify-items:center;gap:2px;font-size:.72rem;font-weight:600;color:var(--muted);padding:6px 0}
  .tabbar button.on{color:var(--brand)}
  .tabbar .fab{width:62px;height:62px;border-radius:50%;background:var(--brand);color:var(--brand-ink);justify-self:center;margin-top:-26px;display:grid;place-items:center;box-shadow:0 8px 20px -6px rgba(12,92,70,.6);border:4px solid var(--bg)}
  .tabbar .fab svg{width:28px;height:28px}
}

/* ---------- tipografia ---------- */
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.015em}
h1{font-size:clamp(1.8rem,4.6vw,2.7rem);font-weight:750;line-height:1.05;font-variation-settings:"wdth" 88}
h2{font-size:1.2rem;font-weight:700}
h3{font-size:1.02rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.85rem}

/* ---------- botões ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:12px;padding:.72rem 1.1rem;font-weight:650;line-height:1.2;transition:transform .08s ease}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--brand);color:var(--brand-ink)}
.btn.debit{background:var(--debit);color:#fff}
.btn.credit{background:var(--credit);color:#fff}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.subtle{background:var(--surface2);color:var(--ink)}
.btn.danger{background:transparent;border-color:var(--debit);color:var(--debit)}
.btn.block{width:100%}
.btn.xl{padding:1rem 1.4rem;font-size:1.05rem;border-radius:14px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.link{border:0;background:transparent;color:var(--brand);font-weight:650;padding:.2rem 0}
.inp{border:1px solid var(--line);border-radius:var(--r-sm);padding:.75rem .85rem;background:var(--surface);width:100%;font-size:1rem}
.inp:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.field{display:grid;gap:6px}

/* ---------- superfícies ---------- */
.surface{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.pad{padding:20px}
.sec{display:grid;gap:14px;margin-top:28px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:4px 12px;flex-wrap:wrap}

/* ---------- caixa ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:28px;align-items:center;padding:28px;border-radius:26px;background:var(--brand);color:var(--brand-ink);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:repeating-radial-gradient(circle at 92% 8%,rgba(255,255,255,.07) 0 1px,transparent 1px 11px);pointer-events:none}
.hero > *{position:relative;min-width:0}
.hero .place{opacity:.85;font-weight:600}
.hero h1{margin-top:6px}
.hero p.lead{margin-top:10px;opacity:.88;max-width:42ch}
.hero-actions{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.hero .btn.scan{background:var(--brand-ink);color:var(--brand);font-size:1.1rem;padding:1.05rem 1.4rem;border-radius:16px}
:root[data-theme="dark"] .hero .btn.scan{background:#06120D;color:#5CC892}
.quick{display:flex;gap:8px;background:rgba(255,255,255,.12);border-radius:14px;padding:6px}
.quick input{flex:1;min-width:0;border:0;background:transparent;color:inherit;padding:.6rem .7rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.quick input::placeholder{color:inherit;opacity:.7;text-transform:none;letter-spacing:0}
.quick input:focus{outline:none}
.quick button{border:0;border-radius:10px;background:rgba(255,255,255,.2);color:inherit;font-weight:700;padding:.5rem 1rem}
.quick-msg{font-size:.85rem;min-height:1.2em;opacity:.95}
@media (max-width:760px){.hero{grid-template-columns:minmax(0,1fr);padding:22px;border-radius:22px}}

.figures{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);margin-top:18px}
.fig{padding:16px 18px;display:grid;gap:2px}
.fig + .fig{border-left:1px solid var(--line)}
.fig .v{font-family:var(--display);font-size:1.45rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.fig .k{font-size:.84rem;color:var(--muted)}
@media (max-width:760px){.figures{grid-template-columns:1fr 1fr}.fig:nth-child(3){border-left:0}.fig:nth-child(n+3){border-top:1px solid var(--line)}}

/* ---------- lista de movimentações ---------- */
.ledger{list-style:none;margin:0;padding:0}
.lrow{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px}
.lrow + .lrow{border-top:1px solid var(--line)}
.lic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--tc-soft);color:var(--tc)}
.lmain{min-width:0}
.lmain b{display:block;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lmain span{display:block;font-size:.84rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lamt{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.lamt span{display:block;font-size:.8rem;color:var(--muted);font-weight:500}
.t-debit{--tc:var(--debit);--tc-soft:var(--debit-soft)}
.t-credit{--tc:var(--credit);--tc-soft:var(--credit-soft)}
.t-add{--tc:var(--add);--tc-soft:var(--add-soft)}
.t-swap{--tc:var(--swap);--tc-soft:var(--swap-soft)}
.t-muted{--tc:var(--muted);--tc-soft:var(--surface2)}
.lamt.neg{color:var(--debit)} .lamt.pos{color:var(--credit)}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}

/* ---------- cartão (o elemento memorável) ---------- */
.cface{--cc:#0C5C46;position:relative;overflow:hidden;color:#fff;border-radius:18px;aspect-ratio:1.586;padding:18px 20px;display:flex;flex-direction:column;justify-content:space-between;
  background:
    radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,var(--cc) 55%,#fff 10%) 0%,transparent 55%),
    linear-gradient(140deg,var(--cc) 0%,color-mix(in srgb,var(--cc) 62%,#000) 100%);
  box-shadow:0 18px 30px -18px color-mix(in srgb,var(--cc) 70%,#000),inset 0 0 0 1px rgba(255,255,255,.08);text-align:left;border:0;width:100%}
.cface::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;
  background:
    repeating-radial-gradient(circle at 18% 120%,rgba(255,255,255,.09) 0 1px,transparent 1px 7px),
    repeating-radial-gradient(circle at 105% -10%,rgba(255,255,255,.07) 0 1px,transparent 1px 9px)}
.cface::after{content:"";position:absolute;right:18px;bottom:-38px;width:120px;height:120px;border-radius:50%;border:1.5px dashed rgba(255,255,255,.22)}
.cface > *{position:relative;z-index:1}
.cf-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.cf-brand{font-family:var(--display);font-weight:700;font-size:.92rem;line-height:1.1;opacity:.95}
.cf-brand small{display:block;font-family:var(--text);font-weight:500;font-size:.72rem;opacity:.75}
.cf-chip{width:38px;height:28px;border-radius:6px;background:linear-gradient(135deg,#E9D29A,#B8924A);box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.cf-code{font-family:var(--display);font-weight:600;font-size:clamp(1.25rem,3.4vw,1.6rem);letter-spacing:.22em;font-variation-settings:"wdth" 80}
.cf-bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.cf-l{display:block;font-size:.7rem;opacity:.72}
.cf-name{display:block;font-weight:650;max-width:16ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cf-amt{display:block;font-family:var(--display);font-weight:750;font-size:clamp(1.4rem,4.2vw,1.9rem);line-height:1;font-variant-numeric:tabular-nums;text-align:right}
.cface.sm{padding:14px 16px;border-radius:16px}
.cface.sm .cf-code{font-size:1.1rem}
.cface.sm .cf-amt{font-size:1.3rem}
.cface.sm .cf-chip{width:30px;height:22px}
.cface.sm::after{width:90px;height:90px;bottom:-30px}
.cface.dim{filter:saturate(.35) brightness(.95)}

.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.cgrid .cface{cursor:pointer;transition:transform .15s ease}
.cgrid .cface:hover{transform:translateY(-2px)}
.status{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:650;border-radius:999px;padding:.15rem .6rem;background:rgba(255,255,255,.18)}

/* ---------- página do cartão ---------- */
.cardpage{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:860px){.cardpage{grid-template-columns:1fr}}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--muted);font-weight:650;padding:.3rem 0;margin-bottom:12px}
.actions{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.act{display:grid;gap:10px;justify-items:start;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:14px;text-align:left;font-weight:650;transition:border-color .15s}
.act:hover{border-color:var(--tc)}
.act .lic{width:38px;height:38px}
.act small{display:block;font-weight:500;color:var(--muted);font-size:.8rem;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.42rem .5rem .42rem .85rem;font-weight:600;font-size:.92rem}
.chip em{font-style:normal;font-variant-numeric:tabular-nums;font-weight:700;border-radius:999px;padding:.1rem .55rem;background:var(--tc-soft);color:var(--tc)}

/* ---------- extrato ---------- */
.filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:760px){.filters{grid-template-columns:1fr 1fr}}
.seg{display:inline-flex;background:var(--surface2);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:.45rem .9rem;font-weight:650;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* ---------- ajustes ---------- */
.settings{display:grid;gap:18px}
.set{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:24px;padding:22px}
.set + .set{border-top:1px solid var(--line)}
@media (max-width:760px){.set{grid-template-columns:1fr;gap:12px}}
.set p.d{color:var(--muted);font-size:.9rem;margin-top:4px;max-width:40ch}
.rows{display:grid}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0}
.row + .row{border-top:1px solid var(--line)}
.row .dot{width:12px;height:12px;border-radius:50%;flex:none}
.row .who{display:flex;align-items:center;gap:10px;min-width:0}
.row .who span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:1px solid var(--line);background:transparent;border-radius:10px;width:36px;height:36px;display:grid;place-items:center;color:var(--muted);flex:none}
.iconbtn:hover{color:var(--debit);border-color:var(--debit)}
.inline{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.inline .inp{flex:1;min-width:120px;width:auto}
.tag{font-size:.75rem;font-weight:700;border-radius:999px;padding:.12rem .55rem;background:var(--tc-soft);color:var(--tc)}

/* ---------- fluxo (scanner e confirmações) ---------- */
.flow{position:fixed;inset:0;z-index:30;background:rgba(6,14,11,.55);display:grid;place-items:center;padding:20px}
.flow-card{width:min(520px,100%);max-height:min(860px,calc(100vh - 40px));background:var(--surface);border-radius:26px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
@media (max-width:620px){.flow{padding:0}.flow-card{width:100%;height:100%;max-height:none;border-radius:0}}
.flow-head{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px 10px;border-bottom:1px solid var(--line)}
.flow-head .iconbtn{width:44px;height:44px;border-radius:12px}
.flow-head .iconbtn:hover{color:var(--ink);border-color:var(--ink)}
.flow-title{text-align:center;min-width:0}
.flow-title span{display:block;font-size:.8rem;color:var(--muted);font-weight:600}
.flow-title b{display:block;font-family:var(--display);font-size:1.1rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps{display:flex;justify-content:center;gap:6px;margin-top:6px}
.steps i{width:22px;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--brand)}
.flow-cam{position:relative;background:#000;aspect-ratio:4/3;max-height:46vh;flex:none;overflow:hidden}
@media (max-width:620px){.flow-cam{aspect-ratio:auto;height:46vh}}
.flow-cam video{width:100%;height:100%;object-fit:cover;display:block}
.reticle{position:absolute;left:50%;top:50%;width:min(58%,260px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:22px;box-shadow:0 0 0 9999px rgba(0,0,0,.42)}
.reticle::before{content:"";position:absolute;inset:-2px;border-radius:24px;padding:3px;background:conic-gradient(from 0deg,#fff 0 12%,transparent 12% 25%,#fff 25% 37%,transparent 37% 50%,#fff 50% 62%,transparent 62% 75%,#fff 75% 87%,transparent 87%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.reticle.hit::before{background:#5CC892}
.scanline{position:absolute;left:8%;right:8%;height:2px;background:linear-gradient(90deg,transparent,#5CC892,transparent);top:12%;animation:sweep 2.2s ease-in-out infinite}
@keyframes sweep{50%{top:86%}}
.cam-err{position:absolute;left:16px;right:16px;top:50%;transform:translateY(-50%);color:#fff;text-align:center;font-weight:650;line-height:1.45;background:rgba(0,0,0,.65);padding:14px;border-radius:14px}
.flow-body{padding:18px 20px calc(20px + env(safe-area-inset-bottom,0px));overflow:auto;display:grid;gap:16px;align-content:start;grid-template-columns:minmax(0,1fr)}
.flow-actions{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
.flow-actions.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.hint-box{display:flex;gap:12px;align-items:flex-start;background:var(--surface2);border-radius:var(--r-md);padding:14px}
.hint-box b{display:block;font-family:var(--display);font-size:1.15rem}
.pending{display:flex;align-items:center;justify-content:space-between;gap:10px;border-radius:var(--r-md);padding:12px 14px;background:var(--tc-soft);color:var(--tc);font-weight:650}
.pending .link{color:inherit;text-decoration:underline}
.cardrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px;background:var(--surface);text-align:left;width:100%}
.cardrow .sw{width:42px;height:28px;border-radius:6px;background:linear-gradient(140deg,var(--cc),color-mix(in srgb,var(--cc) 60%,#000))}
.cardrow .cr-main{min-width:0;display:block}
.cardrow .cr-main b{display:block;letter-spacing:.08em;color:var(--ink)}
.cardrow .cr-main small{display:block;font-size:.84rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cardrow .cr-amt{font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
.cardlist{display:grid;gap:8px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:grid;gap:8px;justify-items:start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:14px;font-weight:650}
.tile.wide{grid-column:1/-1;grid-template-columns:auto 1fr;align-items:center;justify-items:stretch}
.tile:hover{border-color:var(--tc)}
.tile small{display:block;color:var(--muted);font-weight:500;font-size:.8rem}

.amount{display:grid;justify-items:center;gap:2px;padding:6px 0}
.amount .big{font-family:var(--display);font-weight:750;font-size:clamp(2.6rem,11vw,3.4rem);line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.amount .big.zero{color:var(--muted)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keypad button{border:0;background:var(--surface2);border-radius:14px;padding:.85rem 0;font-family:var(--display);font-size:1.35rem;font-weight:650}
.keypad button:active{background:var(--line)}

.review{border-radius:var(--r-lg);padding:20px;background:var(--tc-soft);color:var(--tc);display:grid;gap:4px;justify-items:center;text-align:center}
.review .k{display:inline-flex;align-items:center;gap:8px;font-weight:700}
.review .v{font-family:var(--display);font-weight:750;font-size:clamp(2.4rem,10vw,3rem);line-height:1.05;font-variant-numeric:tabular-nums}
.review .d{color:var(--ink);font-weight:600}
.lines{display:grid;border:1px solid var(--line);border-radius:var(--r-md)}
.line{display:flex;justify-content:space-between;gap:12px;padding:11px 14px;font-size:.95rem}
.line + .line{border-top:1px solid var(--line)}
.line span{color:var(--muted)}
.line b{text-align:right;font-variant-numeric:tabular-nums}
.line b.neg{color:var(--debit)} .line b.pos{color:var(--credit)}
.warn{border-radius:var(--r-md);padding:12px 14px;background:var(--debit-soft);color:var(--debit);font-weight:650;display:grid;gap:8px}

.done{display:grid;justify-items:center;text-align:center;gap:6px;padding:8px 0 4px}
.check{width:76px;height:76px;border-radius:50%;background:var(--tc);color:#fff;display:grid;place-items:center;margin-bottom:6px}
.check svg{width:40px;height:40px;stroke-width:2.6}
.check path{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .45s .1s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.done .v{font-family:var(--display);font-weight:750;font-size:2.3rem;line-height:1.05;font-variant-numeric:tabular-nums;color:var(--tc)}
@media (prefers-reduced-motion:reduce){.scanline{animation:none;display:none}.check path{animation:none;stroke-dashoffset:0}.cgrid .cface{transition:none}}

/* ---------- modal e aviso ---------- */
.veil{position:fixed;inset:0;z-index:40;background:rgba(6,14,11,.5);display:none;place-items:center;padding:20px}
.veil.open{display:grid}
.modal{width:min(420px,100%);background:var(--surface);border-radius:22px;padding:22px;display:grid;gap:14px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:50;display:grid;gap:8px;width:min(440px,calc(100% - 32px));pointer-events:none}
@media (max-width:900px){.toasts{bottom:calc(100px + env(safe-area-inset-bottom,0px))}}
.toast{background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 16px;font-weight:600;box-shadow:0 12px 30px -10px rgba(0,0,0,.45);animation:tin .2s ease}
.toast.err{background:var(--debit);color:#fff}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}

/* ---------- folha de QR ---------- */
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:14px}
.qi{border:1px dashed #9aa;border-radius:12px;padding:12px;text-align:center;display:grid;gap:2px;background:#fff;color:#111}
.qi svg{width:100%;height:auto;display:block}
.qi .bar{height:6px;border-radius:3px;background:var(--qc);margin-bottom:6px}
.qi b{font-family:var(--display);font-size:1.02rem}
.qi span{font-size:.8rem;color:#444}
/* ---------- cupom fiscal ---------- */
.rc-veil{position:fixed;inset:0;z-index:35;background:rgba(6,14,11,.62);overflow:auto;padding:28px 16px calc(28px + env(safe-area-inset-bottom,0px))}
.rc-wrap{display:grid;gap:22px;justify-items:center;width:min(390px,100%);margin:0 auto}
.rc-tools{display:grid;gap:8px;width:100%;padding:14px;border-radius:18px;background:var(--surface)}
.rc-tools .two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.paper{width:100%;background:#FFFDF6;color:#1b1b1b;font-family:"Courier Prime","Courier New",monospace;font-size:13px;line-height:1.45;padding:24px 18px 28px;position:relative;box-shadow:0 24px 40px -20px rgba(0,0,0,.7);margin:8px 0}
.paper::before,.paper::after{content:"";position:absolute;left:0;right:0;height:8px;background:linear-gradient(135deg,#FFFDF6 4px,transparent 0) 0 0/8px 8px repeat-x,linear-gradient(-135deg,#FFFDF6 4px,transparent 0) 0 0/8px 8px repeat-x}
.paper::after{bottom:-8px}
.paper::before{top:-8px;transform:rotate(180deg)}
.paper .c{text-align:center}
.paper .ttl{font-size:17px;letter-spacing:.06em}
.paper .sm{font-size:11px;color:#555}
.paper .sep{border-top:1px dashed #666;margin:9px 0}
.paper .sep.dbl{border-top:3px double #444}
.paper .r{display:flex;justify-content:space-between;gap:10px}
.paper .r span:first-child{white-space:nowrap}
.paper .r span:last-child{text-align:right;min-width:0;word-break:break-word}
.paper .it{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:6px}
.paper .it .d{word-break:break-word}
.paper .it .v{text-align:right;white-space:nowrap}
.paper .tot{font-weight:700}
.paper .big{font-size:17px}
.paper .msg{font-size:14px;line-height:1.5;margin-top:4px}
.paper .barcode{display:flex;justify-content:center;height:46px;margin-top:12px}
.paper .barcode i{display:block;height:100%}
.paper .stamp{margin:10px auto 0;width:max-content;border:2px solid #2a6b4a;color:#2a6b4a;border-radius:6px;padding:2px 10px;font-weight:700;transform:rotate(-4deg);letter-spacing:.08em}
.cupom-tag{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;font-weight:650;border-radius:999px;padding:.25rem .75rem;background:var(--credit-soft);color:var(--credit);justify-self:start}

@media print{
  body *{visibility:hidden}
  .print-target,.print-target *{visibility:visible}
  .print-target{position:absolute;left:0;top:0;width:100%}
  #printSheet .qgrid{grid-template-columns:repeat(3,1fr);gap:6mm}
  .qi{break-inside:avoid}
  .paper.print-target{width:80mm;box-shadow:none;margin:0;padding:2mm 3mm}
  .paper.print-target::before,.paper.print-target::after{display:none}
  .rc-veil{position:static;background:none;padding:0;overflow:visible}
}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
/* ============================================================
   DADOS
   ============================================================ */
const KEY = 'cidadeTributos:cartoes';
const PALETTE = ['#9A2F25','#1F4A86','#8A6418','#5B3685','#0C6A50','#A0491B','#7E2552','#34505F'];
const DEFAULT_SC = [
  ['IPTU',80,'c'],['ICMS',60,'c'],['Taxa de lixo',30,'c'],['IPVA',90,'c'],['Pedágio',20,'c'],['ISS',40,'c'],
  ['Imposto de Renda',90,'c'],['Contribuição de melhoria',60,'c'],['IOF',30,'c'],['INSS',70,'c'],
  ['Imposto Seletivo',50,'c'],['IBS e CBS',60,'c'],['Multa da Malha Fina',30,'c'],
  ['Nota Premiada',50,'r'],['Restituição do IR',80,'r'],['13º salário',85,'r'],['Pergunta certa',30,'r']
].map(([n,v,t])=>({n,v,t}));
function defaults(){
  return {
    cards:['CRT456','CRT457','CRT458','CRT459'].map(code=>({code,name:'',saldo:0,hist:[]})),
    shortcuts: DEFAULT_SC.map(x=>({...x})),
    places:['Recepção','Jogo','Stand 1','Stand 2','Stand 3'],
    place:'Jogo', initial:1000, archive:[], theme:'auto', cupons:[], cupomSeq:0, lastLocal:''
  };
}
function load(){
  const base = defaults();
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const d = JSON.parse(raw);
      if(d && Array.isArray(d.cards)) return {
        cards: d.cards.map(c=>({code:String(c.code), name:c.name||'', saldo:Math.max(0,+c.saldo||0), hist:Array.isArray(c.hist)?c.hist:[], final:c.final||null})),
        shortcuts: Array.isArray(d.shortcuts) ? d.shortcuts : base.shortcuts,
        places: Array.isArray(d.places) && d.places.length ? d.places : base.places,
        place: d.place || base.place, initial: +d.initial || base.initial,
        archive: Array.isArray(d.archive) ? d.archive : [], theme: d.theme || 'auto',
        cupons: Array.isArray(d.cupons) ? d.cupons : [], cupomSeq: +d.cupomSeq || 0, lastLocal: d.lastLocal || ''
      };
    }
  }catch(e){}
  return base;
}
let D = load();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(D)); }catch(e){ toast('Não foi possível salvar neste navegador.', true); } }

/* ============================================================
   UTILITÁRIOS
   ============================================================ */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const fmt = n => 'T$ ' + Math.round(n).toLocaleString('pt-BR');
const esc = s => String(s ?? '').replace(/[&<>"]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const norm = x => String(x||'').trim().toUpperCase().replace(/\s+/g,'');
const find = code => D.cards.find(c=>c.code===norm(code));
const colorOf = code => PALETTE[Math.max(0, D.cards.findIndex(c=>c.code===norm(code))) % PALETTE.length];
const hhmm = ts => new Date(ts).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
const ddhh = ts => new Date(ts).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const isToday = ts => new Date(ts).toDateString() === new Date().toDateString();
const ic = id => `<svg class="i"><use href="#i-${id}"/></svg>`;

const KIND = {
  charge:{label:'Cobrança', tone:'debit', icon:'minus', done:'Cobrança confirmada', verb:'Cobrar'},
  credit:{label:'Crédito', tone:'credit', icon:'plus', done:'Crédito confirmado', verb:'Creditar'},
  add:{label:'Saldo adicionado', tone:'add', icon:'wallet', done:'Saldo adicionado', verb:'Adicionar saldo'},
  transfer:{label:'Transferência', tone:'swap', icon:'swap', done:'Transferência confirmada', verb:'Transferir'},
  tout:{label:'Transferência enviada', tone:'swap', icon:'swap'},
  tin:{label:'Transferência recebida', tone:'swap', icon:'swap'},
  undo:{label:'Estorno', tone:'muted', icon:'undo'},
  ret:{label:'Cartão devolvido', tone:'muted', icon:'card'}
};
const kindOf = h => h.k || (h.v<0 ? 'charge' : 'credit');

function tx(code, delta, desc, k){
  const c = find(code); if(!c || !delta) return;
  c.saldo = Math.max(0, Math.round(c.saldo + delta));
  c.hist.unshift({ts:Date.now(), v:Math.round(delta), d:desc||'', p:D.place, s:c.saldo, k, n:c.name});
  c.final = null;
  if(c.hist.length > 500) c.hist.length = 500;
}
function ledger(){
  const all = [];
  D.cards.forEach(c=>c.hist.forEach(h=>all.push({...h, code:c.code, name:h.n ?? c.name})));
  D.archive.forEach(h=>all.push(h));
  return all.sort((a,b)=>b.ts-a.ts);
}

/* desfazer */
const undoStack = [];
function pushUndo(label, items){ undoStack.push({label, items}); if(undoStack.length>40) undoStack.shift(); }
function undoLast(){
  const u = undoStack[undoStack.length-1]; if(!u) return {ok:false, msg:'Nada para desfazer.'};
  for(const it of u.items){
    const c = find(it.code);
    if(!c){ undoStack.pop(); return {ok:false, msg:'Um dos cartões foi removido, então não dá para desfazer.'}; }
    if(c.saldo - it.delta < 0) return {ok:false, msg:`Não dá para desfazer: ${c.code} já usou esse valor.`};
  }
  u.items.forEach(it=>tx(it.code, -it.delta, 'Estorno de ' + u.label, 'undo'));
  undoStack.pop(); save(); render();
  return {ok:true, msg:'Desfeito: ' + u.label + '.'};
}

/* aviso e modal */
function toast(msg, err){
  const t = document.createElement('div'); t.className = 'toast' + (err?' err':''); t.textContent = msg;
  $('#toasts').appendChild(t); setTimeout(()=>t.remove(), 3200);
}
function modal(html){
  $('#modal').innerHTML = html; $('#veil').classList.add('open');
  $$('#modal [data-close]').forEach(b=>b.onclick = closeModal);
  const f = $('#modal').querySelector('input,select,button:not([data-close])'); if(f) f.focus();
}
function closeModal(){ $('#veil').classList.remove('open'); }
function confirmBox(title, text, okLabel, onOk, danger){
  modal(`<h2>${esc(title)}</h2><p class="muted">${text}</p>
    <div class="acts"><button class="btn ghost" data-close>Cancelar</button><button class="btn ${danger?'debit':'primary'}" id="mOk">${esc(okLabel)}</button></div>`);
  $('#mOk').onclick = ()=>{ closeModal(); onOk(); };
}

/* ============================================================
   COMPONENTES
   ============================================================ */
function cardFace(c, size){
  const code = c.code.replace(/(.{3})/g,'$1 ').trim();
  return `<div class="cface ${size||''}" style="--cc:${colorOf(c.code)}" ${size==='sm'?`data-card="${esc(c.code)}" role="button" tabindex="0"`:''}>
    <div class="cf-top"><span class="cf-brand">Cidade dos Tributos<small>Cartão do contribuinte</small></span><span class="cf-chip"></span></div>
    <div class="cf-code">${esc(code)}</div>

function ledgerRow(h, showCard=true){
  const k = KIND[kindOf(h)] || KIND.credit;
  const title = h.d || k.label;
  const sub = [showCard ? `${h.code}${h.name?', '+h.name:''}` : null, h.p || null, isToday(h.ts) ? hhmm(h.ts) : ddhh(h.ts)].filter(Boolean).join(', ');

const R = {view:'caixa', card:null, filt:{period:'hoje', kind:'', place:'', q:''}};
function go(view, card){ R.view = view; R.card = card || null; render(); window.scrollTo(0,0); }

function render(){
  document.documentElement.dataset.theme = D.theme==='auto' ? '' : D.theme;
  if(D.theme==='auto') document.documentElement.removeAttribute('data-theme');
  $$('.place-sel').forEach(s=>{ s.innerHTML = D.places.map(p=>`<option ${p===D.place?'selected':''}>${esc(p)}</option>`).join(''); });
  const nav = R.view==='card' ? 'cartoes' : R.view;
  $$('[data-go]').forEach(b=>b.classList.toggle('on', b.dataset.go===nav));
  const v = $('#view');
  if(R.view==='caixa') v.innerHTML = viewCaixa();

  else if(R.view==='card') v.innerHTML = viewCard();
  else if(R.view==='extrato') v.innerHTML = viewExtrato();

  bindView();
}

/* ligações das telas */
function bindView(){
  const qf = $('#quickForm');
  if(qf) qf.onsubmit = e=>{ e.preventDefault(); const c = find($('#quickCode').value); if(c) go('card', c.code); else $('#quickMsg').textContent = 'Código não encontrado. Confira o cartão ou cadastre em Ajustes.'; };
  const cn = $('#cName');
  if(cn) cn.onchange = ()=>{ const c=find(R.card); c.name = cn.value.trim(); save(); render(); toast('Nome salvo.'); };
  // extrato
  const fq = $('#fQ'); if(fq){
    fq.oninput = ()=>{ R.filt.q = fq.value; const pos = fq.selectionStart; render(); const n=$('#fQ'); n.focus(); n.setSelectionRange(pos,pos); };
    $('#fKind').onchange = e=>{ R.filt.kind = e.target.value; render(); };
    $('#fPlace').onchange = e=>{ R.filt.place = e.target.value; render(); };
    $('#fClear').onclick = ()=>{ R.filt = {period:R.filt.period, kind:'', place:'', q:''}; render(); };
  }
  // ajustes
  const pf = $('#placeForm'); if(pf){
    pf.onsubmit = e=>{ e.preventDefault(); const p=$('#newPlace').value.trim(); if(!p) return; if(D.places.includes(p)) return toast('Esse local já existe.', true); D.places.push(p); save(); render(); toast(`${p} adicionado.`); };
    $('#cardForm').onsubmit = e=>{ e.preventDefault(); const code=norm($('#newCode').value);
      if(!/^[A-Z0-9-]{3,12}$/.test(code)) return toast('Use de 3 a 12 letras ou números.', true);
      if(find(code)) return toast('Esse código já está cadastrado.', true);
      D.cards.push({code,name:'',saldo:0,hist:[]}); save(); render(); toast(`${code} cadastrado.`); };
    $('#scForm').onsubmit = e=>{ e.preventDefault(); const n=$('#scName').value.trim(), v=Math.round(+$('#scVal').value), t=$('#scType').value;
      if(!n || !(v>0)) return toast('Preencha o nome e um valor maior que zero.', true);
      D.shortcuts.push({n,v,t}); save(); render(); toast(`Atalho ${n} adicionado.`); };
    $('#initVal').onchange = e=>{ const v=Math.round(+e.target.value); if(v>0){ D.initial=v; save(); toast('Saldo inicial atualizado.'); } };
    $('#fImport').onchange = importBackup;
  }
}

/* cliques delegados */
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-go],[data-act],[data-card],[data-sc],[data-period],[data-delplace],[data-delcard],[data-delsc],[data-theme-set]');
  if(!t || t.closest('#flow') || t.closest('#modal')) return;
  if(t.dataset.go) return go(t.dataset.go);
  if(t.dataset.card) return go('card', t.dataset.card);
  if(t.dataset.period){ R.filt.period = t.dataset.period; return render(); }
  if(t.dataset.themeSet){ D.theme = t.dataset.themeSet; save(); return render(); }
  if(t.dataset.delplace!==undefined){ const p=D.places[+t.dataset.delplace]; return confirmBox(`Remover ${p}?`, 'O local sai da lista. As movimentações já feitas continuam no extrato.', 'Remover', ()=>{ D.places.splice(+t.dataset.delplace,1); if(D.place===p) D.place=D.places[0]; save(); render(); }, true); }
  if(t.dataset.delcard) return removeCard(t.dataset.delcard);
  if(t.dataset.delsc!==undefined){ D.shortcuts.splice(+t.dataset.delsc,1); save(); return render(); }
  if(t.dataset.sc!==undefined){ const s=D.shortcuts[+t.dataset.sc], c=find(R.card); return openFlow({fixed:true, card:c, op:{kind:s.t==='c'?'charge':'credit', v:s.v, n:s.n}, step:'review'}); }
  const a = t.dataset.act;
  if(a==='scan') return openFlow({});
  if(a==='op'){ const c=find(R.card), k=t.dataset.kind;
    if(k==='scanop') return openFlow({fixed:true, card:c, step:'scanOp'});
    return openFlow({fixed:true, card:c, kind:k, step:'amount'}); }
  if(a==='return') return returnCard(find(R.card));
  if(a==='csv') return exportCSV();
  if(a==='sheet') return buildSheet();
  if(a==='print') return printEl($('#printSheet'));
  if(a==='cupom') return openCupom(find(R.card));
  if(a==='recupom'){ const c=find(R.card), r=D.cupons.find(x=>x.num===c.final); if(r) showReceipt(r); return; }
  if(a==='export') return exportBackup();
  if(a==='wipe') return confirmBox('Apagar tudo?', 'Cartões, saldos, extratos e atalhos voltam ao padrão. Baixe um backup antes, se quiser guardar.', 'Apagar tudo', ()=>{ D=defaults(); undoStack.length=0; save(); go('caixa'); toast('Tudo apagado.'); }, true);
});
document.addEventListener('keydown', e=>{
  if(e.key==='Enter' && e.target.classList && e.target.classList.contains('cface')) e.target.click();
});
$$('.place-sel').forEach(s=>s.addEventListener('change', e=>{ D.place = e.target.value; save(); render(); toast(`Operando como ${D.place}.`); }));

function archiveCard(c){
  c.hist.forEach(h=>D.archive.push({...h, code:c.code, name:h.n ?? c.name}));
  if(D.archive.length > 5000) D.archive.splice(0, D.archive.length-5000);
}
function returnCard(c){
  if(!c) return;
  confirmBox(`Devolver ${c.code}?`, `O saldo de ${fmt(c.saldo)} é zerado e o nome é apagado, para o cartão ir para o próximo visitante. As movimentações continuam no extrato geral.`, 'Devolver e zerar', ()=>{
    if(c.saldo>0) tx(c.code, -c.saldo, 'Saldo zerado na devolução', 'ret');
    archiveCard(c); c.hist=[]; c.name=''; c.saldo=0; undoStack.length=0; save(); render(); toast(`${c.code} pronto para o próximo visitante.`);
  }, true);
}
function removeCard(code){
  const c = find(code); if(!c) return;
  confirmBox(`Remover ${code}?`, `O cartão sai da lista${c.saldo?` e o saldo de ${fmt(c.saldo)} é perdido`:''}. As movimentações continuam no extrato geral.`, 'Remover', ()=>{
    archiveCard(c); D.cards = D.cards.filter(x=>x.code!==code); save(); if(R.card===code) go('cartoes'); else render();
  }, true);
}

/* planilha e backup */
function download(name, text, type){
  const blob = new Blob([text], {type}); const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
function exportCSV(){
  const rows = [['Data','Hora','Cartão','Titular','Tipo','Descrição','Local','Valor','Saldo após']];
  filtered().forEach(h=>{ const d=new Date(h.ts); rows.push([d.toLocaleDateString('pt-BR'), hhmm(h.ts), h.code, h.name||'', (KIND[kindOf(h)]||{}).label||'', h.d||'', h.p||'', String(h.v).replace('.',','), h.s]); });
  const csv = '\ufeff' + rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(';')).join('\r\n');
  download(`extrato-${new Date().toISOString().slice(0,10)}.csv`, csv, 'text/csv;charset=utf-8');
  toast('Planilha baixada.');
}
function exportBackup(){ download(`cartoes-backup-${new Date().toISOString().slice(0,16).replace(/[:T]/g,'-')}.json`, JSON.stringify(D,null,2), 'application/json'); toast('Backup baixado.'); }
function importBackup(e){
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const d = JSON.parse(r.result); if(!d || !Array.isArray(d.cards)) throw 0;
      confirmBox('Restaurar backup?', `Os ${d.cards.length} cartões do arquivo substituem os dados deste aparelho.`, 'Restaurar', ()=>{
        localStorage.setItem(KEY, JSON.stringify(d)); D = load(); undoStack.length=0; save(); go('caixa'); toast('Backup restaurado.');
      });
    }catch(err){ toast('Este arquivo não é um backup válido.', true); }
  };
  r.readAsText(f); e.target.value='';
}

/* ============================================================
   QR CODES
   ============================================================ */
const QR_CARD = 'CT:CARD:', QR_OP = 'CT:OP:';
const opQR = (t,v,n) => `${QR_OP}${t}:${v}:${encodeURIComponent(n)}`;
function parseQR(text){
  text = String(text||'').trim();
  if(text.startsWith(QR_CARD)){
    const code = norm(text.slice(QR_CARD.length)), c = find(code);
    return c ? {type:'card', card:c} : {type:'bad', msg:`O cartão ${code} não está cadastrado neste aparelho.`};
  }
  if(text.startsWith(QR_OP)){
    const p = text.slice(QR_OP.length).split(':'), t = p[0], v = Math.round(+p[1]);
    let n = p.slice(2).join(':'); try{ n = decodeURIComponent(n); }catch(e){}
    if(!['c','r','a'].includes(t) || !(v>0)) return {type:'bad', msg:'Este QR de tributo está com defeito. Imprima de novo em Ajustes.'};
    return {type:'op', op:{kind:t==='c'?'charge':t==='a'?'add':'credit', v, n:n||KIND[t==='c'?'charge':'credit'].label}};
  }
  const c = find(text); if(c) return {type:'card', card:c};
  return {type:'bad', msg:'Este QR code não pertence ao jogo.'};
}
function buildSheet(){
  if(typeof qrcode !== 'function') return toast('O gerador de QR não carregou. Confira a internet e recarregue a página.', true);
  const items = [];
  if($('#qCards').checked) D.cards.forEach(c=>items.push({txt:QR_CARD+c.code, title:c.code, sub:'Cartão do contribuinte', color:colorOf(c.code)}));
  if($('#qInit').checked) items.push({txt:opQR('a', D.initial, 'Saldo inicial'), title:'Saldo inicial', sub:'Adicionar '+fmt(D.initial), color:'#24508F'});
  if($('#qSc').checked) D.shortcuts.forEach(s=>items.push({txt:opQR(s.t, s.v, s.n), title:s.n, sub:(s.t==='c'?'Cobrar ':'Creditar ')+fmt(s.v), color:s.t==='c'?'#B5302A':'#1F7A4D'}));
  if(!items.length) return toast('Marque pelo menos um tipo de QR.', true);
  $('#qGrid').innerHTML = items.map(it=>{ const q = qrcode(0,'M'); q.addData(it.txt); q.make();
    return `<div class="qi" style="--qc:${it.color}"><div class="bar"></div>${q.createSvgTag(5,2)}<b>${esc(it.title)}</b><span>${esc(it.sub)}</span></div>`; }).join('');
  $('#bPrint').hidden = false; toast(`${items.length} QR codes prontos para imprimir.`);
}

/* ---------- câmera ---------- */
const CAM = {stream:null, timer:null, detector:null, handler:null, last:'', lastTs:0, busy:false, coolUntil:0};
async function camStart(handler){
  CAM.handler = handler;
  $('#fCam').hidden = false;
  if(CAM.stream) return;
  const err = $('#camErr'); err.hidden = true;
  const fail = t => { err.textContent = t; err.hidden = false; };
  if(!window.isSecureContext) return fail('A câmera só abre com o site no endereço https, como o link do GitHub Pages.');
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return fail('Este navegador não libera a câmera. Use o Chrome ou o Safari atualizados, ou escolha o cartão na lista abaixo.');
  try{ CAM.stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}, audio:false}); }
  catch(e){ return fail('A câmera foi bloqueada. Permita o acesso à câmera para este site nas configurações do navegador, ou escolha o cartão na lista abaixo.'); }
  if($('#flow').hidden || !CAM.handler){ camStop(); return; }
  const v = $('#video'); v.srcObject = CAM.stream; try{ await v.play(); }catch(e){}
  CAM.detector = null;
  if('BarcodeDetector' in window){ try{ const fm = await BarcodeDetector.getSupportedFormats(); if(fm.includes('qr_code')) CAM.detector = new BarcodeDetector({formats:['qr_code']}); }catch(e){} }
  if(!CAM.detector && typeof jsQR !== 'function') fail('O leitor de QR não carregou. Confira a internet e recarregue a página.');
  camLoop();
}
async function camLoop(){
  if(!CAM.stream) return;
  const v = $('#video');
  if(v.readyState >= 2 && !CAM.busy && CAM.handler && Date.now() > CAM.coolUntil){
    CAM.busy = true;
    try{
      let text = null;
      if(CAM.detector){ const r = await CAM.detector.detect(v); if(r && r[0]) text = r[0].rawValue; }
      else if(typeof jsQR === 'function'){
        const cv = $('#qrCanvas'), sc = Math.min(1, 640 / v.videoWidth);
        cv.width = Math.round(v.videoWidth*sc); cv.height = Math.round(v.videoHeight*sc);
        const ctx = cv.getContext('2d', {willReadFrequently:true}); ctx.drawImage(v,0,0,cv.width,cv.height);
        const img = ctx.getImageData(0,0,cv.width,cv.height);
        const q = jsQR(img.data, img.width, img.height, {inversionAttempts:'dontInvert'}); if(q) text = q.data;
      }
      if(text) onScan(text);
    }catch(e){}
    CAM.busy = false;
  }
  CAM.timer = setTimeout(camLoop, 150);
}
function camPause(){ CAM.handler = null; $('#fCam').hidden = true; }
function camStop(){ CAM.handler = null; clearTimeout(CAM.timer); if(CAM.stream){ CAM.stream.getTracks().forEach(t=>t.stop()); CAM.stream = null; } $('#video').srcObject = null; $('#fCam').hidden = true; }
function onScan(text){
  const now = Date.now();
  if(text === CAM.last && now - CAM.lastTs < 2500) return;
  CAM.last = text; CAM.lastTs = now;
  const r = $('#reticle'); r.classList.add('hit'); setTimeout(()=>r.classList.remove('hit'), 450);
  if(CAM.handler) CAM.handler(text);
}
window.__scan = onScan; // para testes
function beep(ok){
  try{ navigator.vibrate && navigator.vibrate(ok?50:[60,50,60]); }catch(e){}
  try{ const a = beep.ctx || (beep.ctx = new (window.AudioContext||window.webkitAudioContext)());
    const o=a.createOscillator(), g=a.createGain(); o.frequency.value = ok?1100:320; g.gain.value=.07;
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+(ok?.08:.22)); }catch(e){}
}

/* ============================================================
   FLUXO DE OPERAÇÃO
   Etapas: escanear cartão → confirmar cartão → escolher operação
           → (escanear tributo | digitar valor → destino) → revisar → concluído
   ============================================================ */
let F = null;
const STEP_ORDER = {scanCard:1, pickCard:1, confirmCard:2, action:3, scanOp:3, amount:3, pickDest:3, scanDest:3, confirmDest:3, review:4, done:5};
function openFlow(init){
  F = {step:'scanCard', card:null, op:null, kind:null, dest:null, amt:'', desc:'', stack:[], fixed:false, receipt:null, ...init};
  if(F.kind) F.amt = '';
  $('#flow').hidden = false; document.body.style.overflow = 'hidden';
  renderFlow();
}
function closeFlow(){ camStop(); $('#flow').hidden = true; document.body.style.overflow = ''; F = null; render(); }
function step(s, patch){ F.stack.push({step:F.step, op:F.op, dest:F.dest, kind:F.kind}); Object.assign(F, patch||{}); F.step = s; renderFlow(); }
function back(){
  if(F.step==='done' || !F.stack.length) return closeFlow();
  const prev = F.stack.pop(); Object.assign(F, prev); renderFlow();
}
$('#fBack').onclick = ()=>back();
$('#fClose').onclick = ()=>closeFlow();
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ if($('#veil').classList.contains('open')) closeModal(); else if(!$('#rcVeil').hidden) closeReceipt(); else if(F) closeFlow(); }
  if(F && F.step==='amount' && !(e.target instanceof HTMLInputElement)){
    if(/^[0-9]$/.test(e.key)){ keypad(e.key); e.preventDefault(); }
    else if(e.key==='Backspace'){ keypad('del'); e.preventDefault(); }
    else if(e.key==='Enter'){ const b=$('#amtNext'); if(b && !b.disabled) b.click(); }
  }
});

function head(eyebrow, title){
  $('#fEyebrow').textContent = eyebrow; $('#fTitle').textContent = title;
  const n = STEP_ORDER[F.step]||1;
  $('#fSteps').innerHTML = [1,2,3,4].map(i=>`<i class="${i<=Math.min(n,4)?'on':''}"></i>`).join('');
  $('#fBack').style.visibility = F.step==='done' ? 'hidden' : 'visible';
}
function cardMini(c){
  return `<div class="cardrow" style="cursor:default"><span class="sw" style="--cc:${colorOf(c.code)}"></span><span class="cr-main"><b>${esc(c.code)}</b><small>${c.name?esc(c.name):'Cartão livre'}</small></span><span class="cr-amt">${fmt(c.saldo)}</span></div>`;
}
function opLabel(op){ const k = KIND[op.kind]; return `${op.n} (${k.verb.toLowerCase()} ${fmt(op.v)})`; }

function renderFlow(){

      ${F.op?`<div class="pending t-${KIND[F.op.kind].tone}"><span>Tributo já lido: ${esc(opLabel(F.op))}</span><button class="link" id="dropOp">Descartar</button></div>`:''}

    const d = $('#dropOp'); if(d) d.onclick = ()=>{ F.op=null; renderFlow(); };

      </div>

        <button class="btn primary xl block" id="nextCard">${ic('scan')}Escanear próximo cartão</button>
        <button class="btn subtle block" id="sameCard">Nova operação neste cartão</button>
        <button class="btn subtle block" id="doneCupom">${ic('check')}Finalizar e emitir cupom</button>
        <div class="flow-actions ${r.undone?'':'two'}">
          ${r.undone?'':`<button class="btn ghost" id="undoOp">${ic('undo')}Desfazer</button>`}
          <button class="btn ghost" id="finish">Concluir</button>
        </div>
      </div>`;
    $('#nextCard').onclick = ()=>{ F = {step:'scanCard', card:null, op:null, kind:null, dest:null, amt:'', desc:'', stack:[], fixed:false}; renderFlow(); };
    $('#sameCard').onclick = ()=>{ const c = find(r.code); F = {step:'action', card:c, op:null, kind:null, dest:null, amt:'', desc:'', stack:[], fixed:true}; renderFlow(); };
    $('#finish').onclick = ()=>closeFlow();
    $('#doneCupom').onclick = ()=>{ const cc = find(r.code); closeFlow(); openCupom(cc); };
    const u = $('#undoOp'); if(u) u.onclick = ()=>{ const res = undoLast(); toast(res.msg, !res.ok); if(res.ok){ r.undone = true; renderFlow(); } };
  }
}
function keypad(key){
  if(key==='del') F.amt = F.amt.slice(0,-1);
  else if((F.amt + key).replace(/^0+/,'').length <= 6) F.amt = (F.amt + key).replace(/^0+/,'');
  updAmt();
}
function updAmt(){
  const v = +F.amt || 0, b = $('#amtBig');
  if(b){ b.textContent = fmt(v); b.classList.toggle('zero', !v); }
  const n = $('#amtNext'); if(n) n.disabled = !v;
}
function commit(v){
  const c = F.card, op = F.op, d = F.dest;
  let items;
  if(op.kind==='charge'){ tx(c.code, -v, op.n, 'charge'); items=[{code:c.code, delta:-v}]; }
  else if(op.kind==='transfer'){
    const note = op.n ? ', ' + op.n : '';
    tx(c.code, -v, `Transferência para ${d.code}${note}`, 'tout'); tx(d.code, v, `Transferência de ${c.code}${note}`, 'tin');
    items=[{code:c.code, delta:-v},{code:d.code, delta:v}];
  }
  else { tx(c.code, v, op.n, op.kind); items=[{code:c.code, delta:v}]; }
  const verb = {charge:'cobrança', credit:'crédito', add:'saldo adicionado', transfer:'transferência'}[op.kind];
  pushUndo(`${verb} de ${fmt(v)} em ${c.code}`, items);
  save(); beep(true);
  F.receipt = {kind:op.kind, v, n:op.n, code:c.code, name:c.name, dest:d?d.code:null, out:op.kind==='charge'||op.kind==='transfer'};
  F.stack = []; F.step = 'done'; renderFlow(); render();
}

/* ============================================================
   CUPOM FISCAL
   ============================================================ */
const money = n => (n<0?'-':n>0?'+':'') + Math.abs(Math.round(n)).toLocaleString('pt-BR',{minimumFractionDigits:2});
const moneyAbs = n => 'T$ ' + Math.abs(Math.round(n)).toLocaleString('pt-BR',{minimumFractionDigits:2});
function printEl(el){
  if(!el) return;
  el.classList.add('print-target');
  const done = ()=>{ el.classList.remove('print-target'); window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  window.print();
  setTimeout(done, 1500);
}
function openCupom(c){
  if(!c) return;
  if(!c.hist.length) return toast('Este cartão ainda não tem movimentações.', true);
  modal(`<h2>Finalizar e emitir cupom</h2>
    <p class="muted">O cupom lista tudo o que entrou e saiu do cartão ${esc(c.code)} e fecha a contagem com o saldo final de ${fmt(c.saldo)}.</p>
    <label class="field"><span class="lbl">Nome do participante</span><input class="inp" id="cpName" value="${esc(c.name)}" maxlength="30" placeholder="Nome do participante"></label>
    <label class="field"><span class="lbl">Local de emissão</span><input class="inp" id="cpLocal" value="${esc(D.lastLocal)}" maxlength="40" placeholder="Por exemplo Ginásio, bloco B"></label>
    <p class="flash" id="cpMsg" style="color:var(--debit);font-weight:650;min-height:1.2em;margin:0"></p>
    <div class="acts"><button class="btn ghost" data-close>Cancelar</button><button class="btn primary" id="cpOk">Emitir cupom</button></div>`);
  $('#cpName').focus();
  $('#cpOk').onclick = ()=>{
    const name = $('#cpName').value.trim(), local = $('#cpLocal').value.trim();
    if(!name){ $('#cpMsg').textContent = 'Escreva o nome do participante.'; return $('#cpName').focus(); }
    if(!local){ $('#cpMsg').textContent = 'Escreva o local de emissão.'; return $('#cpLocal').focus(); }
    c.name = name; D.lastLocal = local;
    D.cupomSeq = (D.cupomSeq||0) + 1;
    const r = buildReceipt(c, local, D.cupomSeq);
    D.cupons.push(r); if(D.cupons.length>400) D.cupons.shift();
    c.final = r.num;
    save(); closeModal(); render(); showReceipt(r);
  };
}
function buildReceipt(c, local, num){
  const hist = [...c.hist].reverse();
  const sum = k => hist.filter(h=>kindOf(h)===k).reduce((a,h)=>a+h.v,0);
  return {
    num, code:c.code, name:c.name, local, ts:Date.now(), operador:D.place, saldo:c.saldo,
    items: hist.map(h=>({d:h.d || KIND[kindOf(h)].label, k:kindOf(h), v:h.v})),
    s:{add:sum('add'), charge:sum('charge'), credit:sum('credit'), tout:sum('tout'), tin:sum('tin'), undo:sum('undo'), ret:sum('ret')}
  };
}
function barcode(text){
  let html = '';
  for(const ch of text){
    const n = ch.charCodeAt(0);
    for(let j=0;j<4;j++){ const w = 1 + ((n>>j)&1) + ((n>>(j+3))&1); html += `<i style="width:${w}px;background:${j%2?'transparent':'#1b1b1b'}"></i>`; }
  }
  return html;
}
function receiptHTML(r){
  const d = new Date(r.ts), nn = String(r.num).padStart(6,'0');
  const row = (a,b,cls='') => `<div class="r ${cls}"><span>${a}</span><span>${b}</span></div>`;
  const s = r.s, lines = [];
  if(s.add) lines.push(row('Saldo adicionado', money(s.add)));
  if(s.charge) lines.push(row('Tributos e cobranças', money(s.charge)));
  if(s.credit) lines.push(row('Créditos recebidos', money(s.credit)));
  if(s.tout) lines.push(row('Transferências enviadas', money(s.tout)));
  if(s.tin) lines.push(row('Transferências recebidas', money(s.tin)));
  if(s.undo) lines.push(row('Estornos', money(s.undo)));
  if(s.ret) lines.push(row('Saldo zerado', money(s.ret)));
  return `<div class="paper" id="paper">
    <div class="c"><b class="ttl">CIDADE DOS TRIBUTOS</b><br>Banco dos cartões<br><span class="sm">Feira técnica</span></div>
    <div class="sep"></div>
    <div class="c"><b>CUPOM FISCAL</b><br><span class="sm">Documento simbólico, sem valor fiscal</span></div>
    <div class="sep"></div>
    ${row('Participante', `<b>${esc(r.name)}</b>`)}
    ${row('Cartão', esc(r.code))}
    ${row('Data de emissão', d.toLocaleDateString('pt-BR'))}
    ${row('Horário de emissão', d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'}))}
    ${row('Local de emissão', esc(r.local))}
    ${row('Cupom nº', nn)}
    <div class="sep"></div>
    <div class="it"><b>#</b><b>DESCRIÇÃO</b><b style="text-align:right">VALOR T$</b></div>
    ${r.items.map((it,i)=>`<div class="it"><span>${String(i+1).padStart(3,'0')}</span><span class="d">${esc(it.d)}</span><span class="v">${money(it.v)}</span></div>`).join('')}
    <div class="sep"></div>
    ${lines.join('')}
    ${row('Quantidade de itens', r.items.length)}
    <div class="sep dbl"></div>
    ${row('TOTAL PAGO EM TRIBUTOS', moneyAbs(r.s.charge), 'tot')}
    ${row('SALDO FINAL', moneyAbs(r.saldo), 'tot big')}
    <div class="sep"></div>
    <div class="c msg"><b>Agradecemos sua participação!</b><br>Resgate seu brinde no final mostrando este cupom fiscal ;)</div>
    <div class="stamp">CONTAGEM FINALIZADA</div>
    <div class="barcode">${barcode('CT'+nn+r.code)}</div>
    <div class="c sm">CT-${nn}-${esc(r.code)}</div>
  </div>`;
}
let RC = null;
function showReceipt(r){
  RC = r;
  $('#rcPaper').innerHTML = receiptHTML(r);
  $('#rcVeil').hidden = false; $('#rcVeil').scrollTop = 0; document.body.style.overflow = 'hidden';
  $('#rcPrint').focus();
}
function closeReceipt(){ $('#rcVeil').hidden = true; document.body.style.overflow = ''; RC = null; }
$('#rcPrint').onclick = ()=>printEl($('#paper'));
$('#rcClose').onclick = ()=>closeReceipt();
$('#rcReturn').onclick = ()=>{ const c = RC && find(RC.code); closeReceipt(); if(c) returnCard(c); };

/* sincroniza com outras abas do mesmo navegador */
window.addEventListener('storage', e=>{ if(e.key===KEY){ D = load(); render(); } });

render();
</script>
</body>
